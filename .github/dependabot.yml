version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/.docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      "@react-router/*":
        patterns:
          - "react-router"
          - "@react-router/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      "@tailwindcss/*":
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      "@commitlint/*":
        patterns:
          - "@commitlint/*"
      vite:
        patterns:
          - "vite"
