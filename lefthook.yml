post-merge:
  parallel: true
  commands:
    dependencies:
      run: npm install

post-checkout:
  parallel: true
  commands:
    dependencies:
      run: npm install

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx biome check --no-errors-on-unmatched {staged_files}

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
