load_module modules/ngx_http_js_module.so;

events {
  worker_connections 1024;
}

http {
  js_import /etc/nginx/stats.js;

  # Holds the previous interface reading, so throughput can be a delta between
  # two polls instead of an average since boot.
  js_shared_dict_zone zone=network:64k;

  # stats.js pulls four glances plugins that come to ~6k combined. Sized far
  # past that but nowhere near the container's 32m limit, since nginx drops a
  # subrequest outright ("too big subrequest response") when it does not fit.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  subrequest_output_buffer_size 256k;

  server {
    listen 80;

    location / {
      proxy_pass http://node:3000;
    }

    location = /api {
      gunzip on;
      js_content stats;
    }

    location /glances {
      internal;

      gunzip on;
      rewrite /glances/(.*) /$1 break;
      proxy_pass http://glances:61208;
    }

    # Static file drop, served at /downloads without a trailing slash.
    # autoindex only runs on a URI ending in "/", so rewrite internally rather
    # than 301 to /downloads/.
    location = /downloads {
      rewrite ^ /downloads/ last;
    }

    # Directory listings. autoindex emits relative links, which resolve against
    # the parent when the URL has no trailing slash, so sub_filter absolutises
    # them. Matching only URIs ending in "/" keeps the filter off served files,
    # which would otherwise have their own markup rewritten.
    # autoindex_exact_size off gives 1.4M rather than 1468006.
    location ~ ^/downloads(/.*)?/$ {
      root /srv;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;
      sub_filter '<a href="' '<a href="$uri';
      sub_filter_once off;
    }

    # The files themselves. absolute_redirect off so a subdirectory hit without
    # its slash redirects relatively instead of to http://<host>/.
    location /downloads {
      root /srv;
      absolute_redirect off;
    }

    # The P1 meter on the LAN. busibee's data app polls this every 15s to fill
    # energy_readings, so it has to stay in the repo - it used to live only on
    # the server and a deploy wiped it.
    location /energy {
      proxy_pass http://10.0.0.211/api/v1/data;
      proxy_pass_request_headers off;
    }
  }
}
