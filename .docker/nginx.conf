load_module modules/ngx_http_js_module.so;

events {
  worker_connections 1024;
}

http {
  # /downloads serves files off disk, and without these nginx labels every one
  # of them text/plain, so a pdf renders as mojibake instead of opening.
  # Proxied responses keep whatever content type the upstream sets.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  js_import /etc/nginx/stats.js;

  # Holds the previous interface reading, so throughput can be a delta between
  # two polls instead of an average since boot.
  js_shared_dict_zone zone=network:64k;

  # stats.js pulls four glances plugins that come to ~6k combined. Sized far
  # past that but nowhere near the container's 32m limit, since nginx drops a
  # subrequest outright ("too big subrequest response") when it does not fit.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  subrequest_output_buffer_size 256k;

  server {
    listen 80;

    location / {
      proxy_pass http://node:3000;
    }

    location = /api {
      gunzip on;
      js_content stats;
    }

    location /glances {
      internal;

      gunzip on;
      rewrite /glances/(.*) /$1 break;
      proxy_pass http://glances:61208;
    }

    # Static file drop. The canonical form carries no trailing slash, so any
    # slashed URI redirects to the bare one.
    location ~ ^/downloads(.*)/$ {
      absolute_redirect off;
      return 301 /downloads$1;
    }

    location /downloads {
      root /srv;
      absolute_redirect off;
      # autoindex only runs on a URI ending in "/", which the redirect above
      # would bounce straight back, so directories are rendered from an
      # internal URI instead.
      if (-d $request_filename) {
        set $dlbase $uri;
        rewrite ^/downloads(.*)$ /internal-downloads$1/ last;
      }
    }

    location /internal-downloads/ {
      internal;
      alias /srv/downloads/;

      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;

      # autoindex writes links relative to the trailing slash this layout does
      # not have, so rebuild them against the real path and drop the slash it
      # puts on directories. Only listings pass through here, so a served
      # .html file keeps its own markup.
      sub_filter '<a href="' '<a href="$dlbase/';
      sub_filter '/">' '">';
      sub_filter_once off;
    }

    # The P1 meter on the LAN. busibee's data app polls this every 15s to fill
    # energy_readings, so it has to stay in the repo - it used to live only on
    # the server and a deploy wiped it.
    location /energy {
      proxy_pass http://10.0.0.211/api/v1/data;
      proxy_pass_request_headers off;
    }
  }
}
