load_module modules/ngx_http_js_module.so;

events {
  worker_connections 1024;
}

http {
  js_import /etc/nginx/stats.js;

  # glances /api/4/all is ~650k and grows with every release it picks up,
  # so these are sized well past it - nginx drops the subrequest outright
  # ("too big subrequest response") the moment it does not fit.
  proxy_buffer_size 128k;
  proxy_buffers 8 256k;
  proxy_busy_buffers_size 512k;
  subrequest_output_buffer_size 4m;

  server {
    listen 80;

    location / {
      proxy_pass http://node:3000;
    }

    location = /api {
      gunzip on;
      js_content stats;
    }

    location /glances {
      internal;

      gunzip on;
      rewrite /glances/(.*) /$1 break;
      proxy_pass http://glances:61208;
    }
  }
}
